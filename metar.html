<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>METAR Monitor</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background-color: #161b22;
      color: #c9d1d9;
      font-family: monospace, monospace;
    }
    h2 {
      color: #58a6ff;
      margin-bottom: 12px;
      font-family: sans-serif;
    }
    .metar-box {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px;
      font-size: 1.1rem;
      line-height: 1.5;
      word-break: break-all;
    }
    .timestamp {
      margin-top: 8px;
      font-size: 0.8rem;
      color: #8b949e;
    }
  </style>
</head>
<body>
  <h2>Local METAR Data</h2>
  <div class="metar-box" id="metar-display">Loading METAR observation...</div>
  <div class="timestamp" id="last-updated">Updating...</div>

  <script>
    const STATION_ICAO = 'KBLM'; // Set default ICAO

    async function fetchMetar() {
      try {
        const response = await fetch(`https://rgw.aviationweather.gov/data/cache/metars.json.gz?ids=${STATION_ICAO}`);
        if (!response.ok) throw new Error('Network error');
        const data = await response.json();
        if (data && data.length > 0) {
          document.getElementById('metar-display').innerText = data[0].rawOb || 'No raw observation returned.';
        } else {
          document.getElementById('metar-display').innerText = `No data available for ${STATION_ICAO}`;
        }
      } catch (err) {
        document.getElementById('metar-display').innerText = `Error loading METAR for ${STATION_ICAO}`;
      } finally {
        document.getElementById('last-updated').innerText = 'Last checked: ' + new Date().toLocaleTimeString();
      }
    }

    fetchMetar();
    setInterval(fetchMetar, 300000); // 5 minute refresh cycle
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Lightning Monitor</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; background: #161b22; font-family: sans-serif; color: #fff; }
    #map { width: 100%; height: 100%; }
    .status-panel {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(13, 17, 23, 0.85);
      border: 1px solid #30363d;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff4d4d;
      margin-right: 6px;
    }
    .indicator.connected { background: #2ea44f; }
  </style>
</head>
<body>
  <div class="status-panel">
    <span id="conn-status" class="indicator"></span>
    <span id="conn-text">Connecting...</span>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Initialize Web Audio API Context
    let audioCtx = null;

    // Zero-interaction Autoplay Unlock Logic for Xibo / Embedded WebViews
    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }

      // Play 0.1s silent WAV via HTML5 audio element to satisfy browser policies
      const dummyAudio = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');
      dummyAudio.play().then(() => {
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }).catch(() => {
        // Ignored; falls back to Chromium flag: --autoplay-policy=no-user-gesture-required
      });
    }

    // Trigger audio initialization immediately on DOM ready and events
    window.addEventListener('DOMContentLoaded', initAudio);
    window.addEventListener('click', initAudio, { once: true });

    // Synthesize audio tone for strike alerts
    function playStrikeAlertTone() {
      if (!audioCtx) initAudio();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      if (!audioCtx) return;

      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5 tone
        osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.3);

        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } catch (err) {
        // Audio playback error fallback
      }
    }

    // Leaflet Map Setup
    const map = L.map('map').setView([40.38, -74.06], 9);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 18,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // WebSocket Blitzortung Connection Logic
    let ws;
    function connectWebSocket() {
      ws = new WebSocket('wss://ws1.blitzortung.org:3000/');

      ws.onopen = () => {
        document.getElementById('conn-status').classList.add('connected');
        document.getElementById('conn-text').innerText = 'Live Feed Active';
        ws.send(JSON.stringify({ west: -75.5, east: -72.5, north: 41.5, south: 39.5 }));
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.lat && data.lon) {
            const marker = L.circleMarker([data.lat, data.lon], {
              radius: 6,
              color: '#ffea00',
              fillColor: '#ffaa00',
              fillOpacity: 0.8
            }).addTo(map);

            playStrikeAlertTone();

            // Automatic marker cleanup (15 minute expiration)
            setTimeout(() => map.removeLayer(marker), 900000);
          }
        } catch (e) {}
      };

      ws.onclose = () => {
        document.getElementById('conn-status').classList.remove('connected');
        document.getElementById('conn-text').innerText = 'Reconnecting...';
        setTimeout(connectWebSocket, 5000);
      };
    }

    connectWebSocket();
  </script>
</body>
</html>

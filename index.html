<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Display</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            box-sizing: border-box;
        }

        .dashboard-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 8px;
            box-sizing: border-box;
            gap: 8px;
        }

        .pane {
            width: 100%;
            border-radius: 6px;
            overflow: hidden;
            background-color: #1e293b;
        }

        /* Default Top Panel Height (Landscape) */
        .metar-pane {
            height: 160px;
            flex-shrink: 0;
            transition: height 0.3s ease;
        }

        .main-content-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 8px;
            min-height: 0;
        }

        .widget-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Portrait & Narrow Screen Overrides */
        @media (max-width: 900px), (orientation: portrait) {
            .metar-pane {
                height: 230px; /* Expands top bar for 2-line wrapped content */
            }

            .main-content-grid {
                grid-template-columns: 1fr; /* Stacks weather, lightning, radar widgets vertically */
                grid-template-rows: repeat(4, 1fr);
            }
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <!-- Top METAR Bar -->
    <div class="pane metar-pane">
        <iframe class="widget-frame" src="metar.html" title="METAR Display"></iframe>
    </div>
    
    <!-- Dashboard Main Grid (Weather, Lightning, Radar Viewports) -->
    <div class="main-content-grid">
        <div class="pane">
            <iframe class="widget-frame" src="weather.html" title="Weather Viewport"></iframe>
        </div>
        <div class="pane">
            <iframe class="widget-frame" src="lightning.html" title="Lightning Viewport"></iframe>
        </div>
        <div class="pane">
            <iframe class="widget-frame" src="radar.html" title="Radar Viewport"></iframe>
        </div>
        <div class="pane">
            <iframe class="widget-frame" src="forecast.html" title="Forecast Viewport"></iframe>
        </div>
    </div>
</div>

</body>
</html>

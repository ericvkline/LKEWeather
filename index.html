<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Display</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            box-sizing: border-box;
        }

        .dashboard-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 10px;
            box-sizing: border-box;
            gap: 10px;
        }

        .pane {
            width: 100%;
            border-radius: 6px;
            overflow: hidden;
            background-color: #1e293b;
        }

        /* Default Landscape Height */
        .metar-pane {
            height: 160px;
            flex-shrink: 0;
        }

        .main-pane {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .metar-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Expanded height for portrait/narrow layouts to fit wrapped METAR content */
        @media (max-width: 900px) {
            .metar-pane {
                height: 230px;
            }
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="pane metar-pane">
        <iframe class="metar-iframe" src="metar.html" title="METAR Display"></iframe>
    </div>
    
    <div class="pane main-pane">
        <!-- Main Dashboard Content Goes Here -->
    </div>
</div>

</body>
</html>

<!doctype html>
<html lang="en">
 <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lakehurst Combined Aviation Dashboard</title>
  <style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0b0f19;
        color: #f8fafc;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
        box-sizing: border-box;
    }
 
    .dashboard-container {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        padding: 12px;
        box-sizing: border-box;
        gap: 12px;
    }
 
    .pane {
        width: 100%;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        border: 1px solid #334155;
        background-color: #1e293b;
    }
 
    /* Top METAR Panel (Landscape Default) */
    .metar-pane {
        height: 175px;
        flex-shrink: 0;
        background-color: #e9ecef;
        transition: height 0.3s ease;
    }
 
    /* Lower Content Grid */
    .main-content-grid {
        flex: 1;
        display: grid;
        grid-template-columns: 640px 1fr;
        grid-template-rows: 1fr;
        gap: 12px;
        min-height: 0;
    }
 
    iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
    }
 
    /* Portrait & Narrow Breakpoints */
    @media screen and (max-width: 1100px), screen and (max-aspect-ratio: 1/1), (orientation: portrait) {
        .metar-pane {
            height: 180px !important; /* Forces expansion for 2-line layout */
        }
 
        .main-content-grid {
            grid-template-columns: 1fr;
            grid-template-rows: 1fr 1fr;
        }
    }
</style>
 </head>
 <body>
  <div class="dashboard-container">
   <!-- Top METAR Panel -->
   <div class="pane metar-pane">
    <iframe src="metar.html" title="METAR Display"></iframe>
   </div>

   <div class="main-content-grid">

</html>
